<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><script>if(new URLSearchParams(location.search).get('bg')==='0')document.body.style.background='transparent'</script>
<canvas id="c" width="540" height="1080" style="width:540px;height:1080px"></canvas>
<script>
// WebGL2 re-implementation of MazeRenderer.draw() used only to preview shaders/scene from a desktop browser.
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
if(q.get('w')){canvas.width=+q.get('w');canvas.height=+q.get('h');canvas.style.width=q.get('w')+'px';canvas.style.height=q.get('h')+'px'}
const gl = canvas.getContext('webgl2', {antialias: true, alpha: q.get('bg')==='0', premultipliedAlpha: true, depth: true});
function compile(t, s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)+'\n'+s.split('\n').map((l,i)=>(i+1)+': '+l).join('\n')); return o; }
function prog(vs, fs){ const p=gl.createProgram(); gl.attachShader(p,compile(gl.VERTEX_SHADER,vs)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); p.u={}; return p; }
function U(p,n){ if(!(n in p.u)) p.u[n]=gl.getUniformLocation(p,n); return p.u[n]; }
// matrices (column-major)
const mul=(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o};
function persp(fovy,asp,n,f){const t=1/Math.tan(fovy*Math.PI/360),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o}
function look(e,c,u){const n=a=>{const l=Math.hypot(...a);return a.map(x=>x/l)};const cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
 const f=n([c[0]-e[0],c[1]-e[1],c[2]-e[2]]),s=n(cr(f,u)),uu=cr(s,f);const o=new Float32Array(16);
 o[0]=s[0];o[4]=s[1];o[8]=s[2];o[1]=uu[0];o[5]=uu[1];o[9]=uu[2];o[2]=-f[0];o[6]=-f[1];o[10]=-f[2];o[15]=1;
 o[12]=-(s[0]*e[0]+s[1]*e[1]+s[2]*e[2]);o[13]=-(uu[0]*e[0]+uu[1]*e[1]+uu[2]*e[2]);o[14]=(f[0]*e[0]+f[1]*e[1]+f[2]*e[2]);return o}
function quatMat(x,y,z,w){const o=new Float32Array(16);const xx=x*x,yy=y*y,zz=z*z,xy=x*y,xz=x*z,yz=y*z,wx=w*x,wy=w*y,wz=w*z;
 o[0]=1-2*(yy+zz);o[1]=2*(xy+wz);o[2]=2*(xz-wy);o[4]=2*(xy-wz);o[5]=1-2*(xx+zz);o[6]=2*(yz+wx);o[8]=2*(xz+wy);o[9]=2*(yz-wx);o[10]=1-2*(xx+yy);o[15]=1;return o}
function axisQuat(ax,ang){const l=Math.hypot(...ax);const s=Math.sin(ang/2)/l;return [ax[0]*s,ax[1]*s,ax[2]*s,Math.cos(ang/2)]}

async function main(){
  const D = await (await fetch(q.get('scene')||'scene.json')).json();
  const sh = D.sh;
  const sceneP = prog(sh.SCENE_VS, sh.SCENE_FS), marbleP = prog(sh.MARBLE_VS, sh.MARBLE_FS), bgP = prog(sh.BG_VS, sh.BG_FS);
  const shScene = prog(sh.SCENE_VS, sh.SHADOW_FS), shMarble = prog(sh.MARBLE_VS, sh.SHADOW_FS);
  const mk = (m, attribs)=>{const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(m.v),gl.STATIC_DRAW);
    const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(m.i),gl.STATIC_DRAW);
    const stride=attribs.reduce((a,b)=>a+b,0);let off=0;attribs.forEach((sz,i)=>{gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,sz,gl.FLOAT,false,stride*4,off*4);off+=sz});
    gl.bindVertexArray(null);return {vao,n:m.i.length}};
  const draw=m=>{gl.bindVertexArray(m.vao);gl.drawElements(gl.TRIANGLES,m.n,gl.UNSIGNED_INT,0);gl.bindVertexArray(null)};
  const doorsM=mk(D.doors,[3,3,3,3,1]), holesM=mk(D.holes,[3,3,3,3,1]); const holeP=prog(sh.SCENE_VS, sh.HOLE_FS), cloudP=prog(sh.BG_VS, sh.CLOUD_FS);
  const floor=mk(D.floor,[3,3,3,3,1]), walls=mk(D.walls,[3,3,3,3,1]), markers=mk(D.markers,[3,3,3,3,1]), thread=mk(D.thread,[3,3,3,3,1]);
  // unit sphere
  const rings=40,segs=72,sv=[],si=[];for(let i=0;i<=rings;i++){const th=Math.PI*i/rings;for(let j=0;j<=segs;j++){const ph=2*Math.PI*j/segs;sv.push(Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph))}}
  for(let i=0;i<rings;i++)for(let j=0;j<segs;j++){const a=i*(segs+1)+j,b=a+segs+1;si.push(a,b,a+1,a+1,b,b+1)}
  const sphere=mk({v:sv,i:si},[3]);

  const W=canvas.width,H=canvas.height;
  const POST=q.get('post')==='1';
  const mkTex=(w,h,depth)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);if(depth)gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,w,h,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    const f=depth?gl.NEAREST:gl.LINEAR;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t};
  const mkFbo=(c,d)=>{const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);if(c)gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,c,0);if(d)gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,d,0);return f};
  let msaaFbo=null;
  const hw=W>>1,hh=H>>1,qw=W>>2,qh=H>>2;
  const PX={};
  if(POST){
    const rbC=gl.createRenderbuffer(),rbD=gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER,rbC);gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.RGBA8,W,H);
    gl.bindRenderbuffer(gl.RENDERBUFFER,rbD);gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.DEPTH_COMPONENT24,W,H);
    msaaFbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,msaaFbo);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,rbC);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rbD);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw new Error('msaa fbo incomplete');
    const sets={res:[W,H],comp:[W,H],ao:[hw,hh],aoTmp:[hw,hh],down:[hw,hh],blurA:[hw,hh],blurB:[hw,hh],bloomA:[qw,qh],bloomB:[qw,qh],cloud:[W>>2,H>>2]};
    PX.colorTex=mkTex(W,H);PX.depthTex=mkTex(W,H,true);PX.resFbo=mkFbo(PX.colorTex,PX.depthTex);
    for(const k of Object.keys(sets)){if(k==='res')continue;PX[k+'Tex']=mkTex(...sets[k]);PX[k+'Fbo']=mkFbo(PX[k+'Tex'])}
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    PX.progs={};for(const [k,v] of Object.entries({down:'P_DOWN',blur:'P_BLUR',bright:'P_BRIGHT',ssao:'P_SSAO',cloud:'P_CLOUD',comp:'P_COMP',fxaa:'P_FXAA'}))PX.progs[k]=prog(sh.BG_VS,sh[v]);
  }
  const bindMain=()=>{if(POST){gl.bindFramebuffer(gl.FRAMEBUFFER,msaaFbo);gl.viewport(0,0,W,H)}else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H)}};
  const tri=gl.createVertexArray();
  const fsPass=(fbo,w,h,p,setup)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,w,h);gl.useProgram(p);setup(p);gl.bindVertexArray(tri);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindVertexArray(null)};
  const bt=(u,t)=>{gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t)};
  const orient = (q.get('orient')||'1,0.3,0,0.5').split(',').map(Number); // axis x,y,z, angle
  const oq = axisQuat(orient.slice(0,3), orient[3]); const model = quatMat(...oq);
  const zoom = parseFloat(q.get('zoom')||'0.9'); const growT = parseFloat(q.get('grow')||'1.4'); const TIME=parseFloat(q.get('t')||'0.5');
  const shadowOn = (q.get('shadow')||'1')==='1'; const SS = parseInt(q.get('ss')||'2048');
  const fovY=38, asp=W/H; const tanY=Math.tan(fovY*Math.PI/360), tanMin=Math.min(tanY,tanY*asp);
  const r=D.outer*1.12; const camDist=(r/tanMin+r)*zoom;
  const proj=persp(fovY,asp,0.1,40), view=look([0,0,camDist],[0,0,0],[0,1,0]); const vp=mul(proj,view);
  const L=(()=>{const v=[0.45,0.82,0.55];const l=Math.hypot(...v);return v.map(x=>x/l)})();
  const lview=look(L.map(x=>x*6),[0,0,0],[0,1,0]); const lightVP=mul(ortho(-1.75,1.75,-1.75,1.75,3,9),lview);

  // shadow map
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,SS,SS,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
  const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,tex,0);gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo incomplete');
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  const M=D.marble, pal=D.pal; if(q.get('marble')){const m=q.get('marble').split(',').map(Number);M.pos=m.slice(0,3);M.r=m[3]}
  const marbleU=(p,vpm)=>{gl.useProgram(p);gl.uniformMatrix4fv(U(p,'uVP'),false,vpm);gl.uniformMatrix4fv(U(p,'uModel'),false,model);gl.uniform3fv(U(p,'uCenter'),M.pos);gl.uniform1f(U(p,'uRadius'),M.r)};

  if(shadowOn){
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,SS,SS);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(2,4);
    gl.useProgram(shScene);gl.uniformMatrix4fv(U(shScene,'uVP'),false,lightVP);gl.uniformMatrix4fv(U(shScene,'uModel'),false,model);gl.uniform1f(U(shScene,'uGrowT'),growT);gl.uniform1f(U(shScene,'uTime'),TIME);gl.uniform1f(U(shScene,'uDoorMode'),0);draw(floor);draw(walls);gl.uniform1f(U(shScene,'uDoorMode'),1);draw(doorsM);gl.uniform1f(U(shScene,'uDoorMode'),0);
    marbleU(shMarble,lightVP);draw(sphere);
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }
  // clouds into the small texture
  const CLOUDS=q.get('cloud')==='1';
  if(POST&&CLOUDS){gl.disable(gl.DEPTH_TEST);const cp=PX.progs.cloud;fsPass(PX.cloudFbo,W>>2,H>>2,cp,p=>{gl.uniform1f(U(p,'uTime'),TIME);gl.uniform1f(U(p,'uAspect'),W/H);gl.uniform1f(U(p,'uAmount'),1);gl.uniform1f(U(p,'uDensity'),parseFloat(q.get('dens')||'0.8'));gl.uniform2f(U(p,'uWind'),0.05,0.02);
    const bt0=pal.bgTop;gl.uniform3f(U(p,'uTint'),0.78+bt0[0]*0.35,0.82+bt0[1]*0.3,0.9+bt0[2]*0.2);gl.uniform3f(U(p,'uShade'),0.16+bt0[0]*0.7,0.2+bt0[1]*0.7,0.28+bt0[2]*0.7)})}
  bindMain();gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
  gl.clearColor(0,0,0,q.get('bg')==='0'?0:1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const e=gl.createVertexArray();gl.disable(gl.DEPTH_TEST);if(q.get('bg')!=='0'){gl.useProgram(bgP);gl.uniform3fv(U(bgP,'uTop'),pal.bgTop);gl.uniform3fv(U(bgP,'uBottom'),pal.bgBottom);gl.uniform1f(U(bgP,'uAspect'),W/H);
  gl.bindVertexArray(e);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindVertexArray(null);}
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);

  const sp=sceneP;gl.useProgram(sp);
  gl.uniformMatrix4fv(U(sp,'uVP'),false,vp);gl.uniformMatrix4fv(U(sp,'uModel'),false,model);gl.uniformMatrix4fv(U(sp,'uLightVP'),false,lightVP);
  gl.uniform3f(U(sp,'uCam'),0,0,camDist);gl.uniform3fv(U(sp,'uLightDir'),L);gl.uniform1f(U(sp,'uTime'),TIME);gl.uniform1f(U(sp,'uGrowT'),growT);gl.uniform1f(U(sp,'uDoorMode'),0);
  gl.uniform1f(U(sp,'uShadowOn'),shadowOn?1:0);gl.uniform1f(U(sp,'uTexel'),1/SS);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(U(sp,'uShadow'),0);
  const sc=(m,r,me,em)=>{gl.uniform1i(U(sp,'uMat'),m);gl.uniform1f(U(sp,'uRough'),r);gl.uniform1f(U(sp,'uMetal'),me);gl.uniform1f(U(sp,'uEmissive'),em)};
  sc(pal.floorMat,pal.floorRough,0,0);draw(floor);sc(pal.wallMat,pal.wallRough,1,0);draw(walls);gl.uniform1f(U(sp,'uDoorMode'),1);draw(doorsM);gl.uniform1f(U(sp,'uDoorMode'),0);
  gl.useProgram(holeP);gl.uniformMatrix4fv(U(holeP,'uVP'),false,vp);gl.uniformMatrix4fv(U(holeP,'uModel'),false,model);gl.uniform1f(U(holeP,'uGrowT'),growT);gl.uniform1f(U(holeP,'uTime'),TIME);gl.uniform1f(U(holeP,'uDoorMode'),0);gl.uniform1f(U(holeP,'uAppear'),1);gl.uniform3fv(U(holeP,'uAccent'),pal.accent);gl.uniform3fv(U(holeP,'uLightDir'),L);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-2,-2);draw(holesM);gl.disable(gl.POLYGON_OFFSET_FILL);gl.disable(gl.BLEND);gl.useProgram(sp);
  gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-2,-2);sc(4,0.5,0,0.9);draw(markers);if(q.get('hint')!=='0'){sc(4,0.5,0,0.55);draw(thread)}gl.disable(gl.POLYGON_OFFSET_FILL);

  marbleU(marbleP,vp);gl.uniform3f(U(marbleP,'uCam'),0,0,camDist);gl.uniform3fv(U(marbleP,'uLightDir'),L);gl.uniform3fv(U(marbleP,'uAccent'),pal.accent);
  gl.uniformMatrix3fv(U(marbleP,'uBody'),false,[1,0,0,0,1,0,0,0,1]);gl.uniform1f(U(marbleP,'uGhost'),0);draw(sphere);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthFunc(gl.GREATER);gl.depthMask(false);gl.uniform1f(U(marbleP,'uGhost'),1);draw(sphere);gl.depthMask(true);gl.depthFunc(gl.LEQUAL);gl.disable(gl.BLEND);
  if(POST){
    gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msaaFbo);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,PX.resFbo);gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT,gl.NEAREST);
    const pr=PX.progs;const P0=proj[0],P1=proj[5];const SSAO=q.get('ssao')!=='0',DOF=q.get('dof')!=='0';
    const blur=(src,dst,w,h,dx,dy)=>fsPass(dst,w,h,pr.blur,p=>{bt(0,src);gl.uniform1i(U(p,'uTex'),0);gl.uniform2f(U(p,'uDir'),dx,dy)});
    if(SSAO){fsPass(PX.aoFbo,hw,hh,pr.ssao,p=>{bt(0,PX.depthTex);gl.uniform1i(U(p,'uDepth'),0);gl.uniform4f(U(p,'uProj'),0.1,40,P0,P1);gl.uniform2f(U(p,'uTexel'),1/W,1/H);gl.uniform1f(U(p,'uRadius'),0.075);gl.uniform1f(U(p,'uStrength'),1.6)});
      blur(PX.aoTex,PX.aoTmpFbo,hw,hh,1/hw,0);blur(PX.aoTmpTex,PX.aoFbo,hw,hh,0,1/hh)}
    fsPass(PX.downFbo,hw,hh,pr.down,p=>{bt(0,PX.colorTex);gl.uniform1i(U(p,'uTex'),0);gl.uniform2f(U(p,'uTexel'),1/W,1/H)});
    if(DOF){blur(PX.downTex,PX.blurAFbo,hw,hh,1/hw,0);blur(PX.blurATex,PX.blurBFbo,hw,hh,0,1/hh)}
    fsPass(PX.bloomAFbo,qw,qh,pr.bright,p=>{bt(0,PX.downTex);gl.uniform1i(U(p,'uTex'),0);gl.uniform2f(U(p,'uTexel'),1/hw,1/hh);gl.uniform1f(U(p,'uThreshold'),0.78)});
    blur(PX.bloomATex,PX.bloomBFbo,qw,qh,1/qw,0);blur(PX.bloomBTex,PX.bloomAFbo,qw,qh,0,1/qh);blur(PX.bloomATex,PX.bloomBFbo,qw,qh,2/qw,0);blur(PX.bloomBTex,PX.bloomAFbo,qw,qh,0,2/qh);
    fsPass(PX.compFbo,W,H,pr.comp,p=>{bt(0,PX.colorTex);gl.uniform1i(U(p,'uScene'),0);bt(1,PX.aoTex);gl.uniform1i(U(p,'uAO'),1);bt(2,PX.blurBTex);gl.uniform1i(U(p,'uBlur'),2);bt(3,PX.depthTex);gl.uniform1i(U(p,'uDepth'),3);bt(4,PX.bloomATex);gl.uniform1i(U(p,'uBloom'),4);bt(5,PX.cloudTex);gl.uniform1i(U(p,'uCloud'),5);
      gl.uniform4f(U(p,'uProj'),0.1,40,P0,P1);gl.uniform1f(U(p,'uFocus'),camDist);gl.uniform1f(U(p,'uFocusRange'),D.outer*1.1);gl.uniform1f(U(p,'uAOAmt'),SSAO?0.85:0);gl.uniform1f(U(p,'uDofAmt'),DOF?0.85:0);gl.uniform1f(U(p,'uBloomAmt'),parseFloat(q.get('bloom')||'0.34'));gl.uniform1f(U(p,'uCloudOn'),CLOUDS?1:0);gl.uniform3f(U(p,'uGrade'),0.35,1.08,0.02);gl.uniform1f(U(p,'uVignette'),0.35)});
    fsPass(null,W,H,pr.fxaa,p=>{bt(0,PX.compTex);gl.uniform1i(U(p,'uTex'),0);gl.uniform2f(U(p,'uTexel'),1/W,1/H);gl.uniform1f(U(p,'uTime'),TIME);gl.uniform1f(U(p,'uGrain'),0.035);gl.uniform1f(U(p,'uFxaa'),1)});
  }
  gl.finish();document.title='ready';
}
main().catch(e=>{document.title='error';window.__err=String(e);console.error(e)});
</script>
